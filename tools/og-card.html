<!DOCTYPE html>
<!--
  Source for the social preview card (assets/img/og-v2.jpg) - the picture that
  shows when the site is pasted into Discord, Twitter, Slack or iMessage.

  This is not part of the site. Nothing links to it. It exists so the card can
  be rebuilt instead of redrawn by hand.

  TO REBUILD, after editing the text below:

    1. Screenshot it at exactly 1200x630 (the size every scraper expects):

       & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" `
         --headless=new --disable-gpu --hide-scrollbars `
         --force-device-scale-factor=1 --window-size=1200,630 `
         --virtual-time-budget=8000 --user-data-dir="$env:TEMP\ogshot" `
         --screenshot="$env:TEMP\og.png" `
         "file:///C:/Users/Jonat/Desktop/Projects/Website/tools/og-card.html"

       If it silently writes no file, delete the --user-data-dir folder first;
       a stale profile lock makes headless Edge exit without a word.

    2. Convert to JPG and overwrite BOTH names in assets/img/:

       python -c "from PIL import Image; im=Image.open(r'%TEMP%\og.png').convert('RGB'); im.save(r'assets\img\og-v2.jpg','JPEG',quality=88,subsampling=0,optimize=True,progressive=True)"

       og-v2.jpg is the one the pages point at. og.jpg is the old filename,
       kept holding the same picture so links cached against it stay current.

  WHY JPG when the rest of the site is WebP: link scrapers handle WebP badly.
  This one file stays JPG on purpose.

  WHY the version number in the filename: Discord and Twitter cache a card
  against its URL, sometimes for days. Changing the picture at the same URL
  often changes nothing. Bumping to og-v3.jpg forces every scraper to refetch.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Same tokens as the live site, so the card cannot drift from it. */
  :root {
    --bg:        #07070C;
    --text:      #ECEEF6;
    --text-faint:#6B7392;
    --hot:       #FF2D78;
    --cyan:      #35D6F5;
    --amber:     #FFC93C;
    --green:     #3DF5A0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 1200px; height: 630px; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
    position: relative;
    overflow: hidden;
  }

  /* The site's backdrop: faint grid plus two corner glows. */
  .backdrop {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  .glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(620px 420px at 6% 0%,   rgba(255, 45,120,.20), transparent 70%),
      radial-gradient(680px 460px at 100% 8%, rgba( 53,214,245,.14), transparent 70%),
      radial-gradient(520px 340px at 82% 100%,rgba(255,201, 60,.07), transparent 70%);
  }

  /* Top rule, the same sweep the site uses above feature cards. */
  .bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 8px;
    background: linear-gradient(90deg,
      var(--hot) 0%, #FF6B4A 22%, var(--amber) 44%, var(--green) 68%, var(--cyan) 100%);
  }

  .inner {
    position: relative;
    height: 100%;
    padding: 88px 96px 76px;
    display: flex;
    flex-direction: column;
  }

  /* --- brand ------------------------------------------------ */
  .brand {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .mark {
    width: 22px;
    height: 34px;
    border-radius: 3px;
    background: var(--hot);
    box-shadow: 0 0 22px rgba(255,45,120,.85);
  }

  /* --- headline --------------------------------------------- */
  h1 {
    margin-top: 52px;
    font-size: 88px;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -.028em;
    max-width: 15ch;
  }
  /* "games" picks up the full accent sweep, as on the site's hero. */
  .accent {
    background: linear-gradient(95deg,
      var(--hot) 0%, #FF8A3D 30%, var(--amber) 52%, var(--green) 76%, var(--cyan) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* --- lead ------------------------------------------------- */
  .lead {
    margin-top: 30px;
    font-size: 29px;
    line-height: 1.45;
    font-weight: 500;
    color: #9AA1BC;
    max-width: 37ch;
  }

  /* --- footer strip ----------------------------------------- */
  .strip {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: "JetBrains Mono", Consolas, monospace;
    font-size: 21px;
    font-weight: 500;
    letter-spacing: .11em;
    color: var(--text-faint);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 14px rgba(61,245,160,.9);
    flex: none;
  }
  .sep { color: #3A4060; }
  .live { color: var(--amber); }
</style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="glow"></div>
  <div class="bar"></div>

  <div class="inner">
    <div class="brand"><span class="mark"></span>Jonjoe1001</div>

    <h1>I build <span class="accent">games</span>, tools and simulators!</h1>

    <p class="lead">Roguelikes, physics sims and neural evolution &mdash; plus whatever I get curious about at 2am.</p>

    <div class="strip">
      <span class="dot"></span>
      <span>Timeless <span class="live">in development</span></span>
      <span class="sep">/</span>
      <span>Wheelhouse</span>
      <span class="sep">/</span>
      <span>Emergent Evolver</span>
    </div>
  </div>
</body>
</html>
