<!DOCTYPE html>
<!--
  Source for the social preview card (assets/img/og-v3.jpg) - the picture that
  shows when the site is pasted into Discord, Twitter, Slack or iMessage.

  This is not part of the site. Nothing links to it. It exists so the card can
  be rebuilt instead of redrawn by hand.

  TO REBUILD, after editing the text below:

    1. Screenshot it at exactly 1200x630 (the size every scraper expects):

       & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" `
         --headless=new --disable-gpu --hide-scrollbars `
         --force-device-scale-factor=1 --window-size=1200,630 `
         --virtual-time-budget=8000 --user-data-dir="$env:TEMP\ogshot" `
         --screenshot="$env:TEMP\og.png" `
         "file:///C:/path/to/this/repo/tools/og-card.html"

       If it silently writes no file, delete the --user-data-dir folder first;
       a stale profile lock makes headless Edge exit without a word.

    2. Convert to JPG and overwrite ALL THREE names in assets/img/:

       python -c "from PIL import Image; im=Image.open(r'%TEMP%\og.png').convert('RGB'); [im.save(r'assets\img\%s' % n,'JPEG',quality=88,subsampling=0,optimize=True,progressive=True) for n in ('og-v3.jpg','og-v2.jpg','og.jpg')]"

       og-v3.jpg is the one the pages point at. og-v2.jpg and og.jpg are the
       old filenames, kept holding the same picture so links cached against
       them stay current.

  WHY JPG when the rest of the site is WebP: link scrapers handle WebP badly.
  This one file stays JPG on purpose.

  WHY the version number in the filename: Discord and Twitter cache a card
  against its URL, sometimes for days. Changing the picture at the same URL
  often changes nothing. Bumping to og-v4.jpg forces every scraper to refetch.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Fonts: the same self-hosted files as the site (assets/fonts/). */
  @font-face { font-family: "Geist"; font-weight: 100 900; font-display: swap;
    src: url("../assets/fonts/geist-latin-wght-normal.woff2") format("woff2-variations"); }
  @font-face { font-family: "Geist Mono"; font-weight: 100 900; font-display: swap;
    src: url("../assets/fonts/geist-mono-latin-wght-normal.woff2") format("woff2-variations"); }
  @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; font-display: swap;
    src: url("../assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); }

  /* Same tokens as the live site (assets/css/site.css), so the card cannot drift from it. */
  :root {
    --bg:        #0E0E0D;
    --line:      #2B2A26;
    --text:      #EEEDE6;
    --text-dim:  #A6A49A;
    --text-faint:#8B897F;
    --hot:       rgb(217, 120, 87);   /* ember */
    --cyan:      rgb(142, 183, 194);  /* sea   */
    --amber:     rgb(227, 182, 106);  /* gold  */
    --green:     #9BCB8A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 1200px; height: 630px; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Geist", "Segoe UI", system-ui, sans-serif;
    position: relative;
    overflow: hidden;
  }

  /* Two quiet corner glows in the site's ember and sea. */
  .glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(640px 420px at 4% 0%,    rgba(217,120, 87,.16), transparent 70%),
      radial-gradient(700px 460px at 100% 100%, rgba(142,183,194,.10), transparent 70%);
  }

  /* Thin ember rule along the top. */
  .bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: var(--hot);
  }

  .inner {
    position: relative;
    height: 100%;
    padding: 64px 96px 60px;
    display: flex;
    flex-direction: column;
  }

  /* --- brand ------------------------------------------------ */
  .brand {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -.01em;
  }
  .brand img {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 1px solid var(--line);
  }
  .brand small {
    font-family: "Geist Mono", Consolas, monospace;
    font-size: 19px;
    font-weight: 400;
    letter-spacing: .08em;
    color: var(--text-faint);
  }

  /* --- headline --------------------------------------------- */
  h1 {
    margin-top: 36px;
    font-size: 74px;
    font-weight: 650;
    line-height: 1.06;
    letter-spacing: -.03em;
    max-width: 17ch;
  }
  /* The one serif word, as on the site's hero. */
  .accent {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    letter-spacing: -.01em;
    color: var(--hot);
  }

  /* --- lead ------------------------------------------------- */
  .lead {
    margin-top: 22px;
    font-size: 28px;
    line-height: 1.45;
    color: var(--text-dim);
    max-width: 44ch;
  }

  /* --- footer strip ----------------------------------------- */
  .strip {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: "Geist Mono", Consolas, monospace;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: .1em;
    color: var(--text-faint);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 12px var(--green);
    flex: none;
  }
  .sep { color: #4A4840; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="bar"></div>

  <div class="inner">
    <div class="brand"><img src="../assets/img/pfp-160.webp" alt="">Jonjoe1001 <small>Jonathan Comer</small></div>

    <!-- Same headline and first line as the Home page hero. -->
    <h1>Machine learning, physics &amp; programming <span class="accent">researcher.</span></h1>

    <p class="lead">I train models from scratch on one GPU at home and go after big open challenges.</p>

    <div class="strip">
      <span class="dot"></span>
      <span>Dream World</span>
      <span class="sep">/</span>
      <span>MiniGPT</span>
      <span class="sep">/</span>
      <span>MindFlight</span>
      <span class="sep">/</span>
      <span>Vesuvius Challenge</span>
    </div>
  </div>
</body>
</html>
